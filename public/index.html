<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Media Network — Centro de Control</title>
  <link rel="stylesheet" href="/styles.css?v=1.1.0" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">AI</div><div><strong>AI MEDIA</strong><span>NETWORK</span></div></div>
      <nav id="nav"></nav>
      <div class="sidebar-footer"><div class="status-dot"></div><div><b id="system-status">Sistema</b><span id="system-version">v1.0.1</span></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div><div class="eyebrow">CENTRO DE CONTROL</div><h1 id="page-title">Resumen</h1></div><div class="top-actions"><select id="workspace-select" aria-label="Espacio de trabajo"><option value="NL">México / Nuevo León</option><option value="HGO">México / Hidalgo</option><option value="COL">México / Colima</option></select><button class="ghost" id="refresh-btn">↻ Actualizar</button><button class="avatar">JR</button></div></header>
      <div id="flash"></div>
      <section id="view" class="view"></section>
    </main>
  </div>
  <dialog id="modal"><form method="dialog" class="modal-card"><div class="modal-head"><h3 id="modal-title"></h3><button value="cancel" class="ghost">×</button></div><div id="modal-body"></div></form></dialog>
  <script src="/app.js?v=1.1.0"></script>
</body>
</html>
