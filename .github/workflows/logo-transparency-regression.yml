name: Logo transparency regression
on:
  pull_request:
    paths:
      - 'services/brand-studio.js'
      - 'tests/brand-studio.test.js'
      - 'package.json'
      - 'server.js'
  workflow_dispatch:
jobs:
  logo-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Generate Prisma
        run: npm run db:generate
      - name: Validate syntax
        run: npm run check
      - name: Render brand and logo tests
        run: npm run test:brand
