name: Publication tracking v1.11.2
on:
  pull_request:
    paths:
      - services/publication.js
      - public/app.js
      - server.js
      - package.json
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run check
      - run: npm run test:visual
      - run: npm run test:quality
