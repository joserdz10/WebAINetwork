name: Editorial brand layouts validation
on:
  pull_request:
    paths:
      - 'services/brand-studio.js'
      - 'tests/brand-studio.test.js'
      - 'server.js'
      - 'public/app.js'
      - 'package.json'
  workflow_dispatch:
jobs:
  visual-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run check
      - run: npm run test:brand
